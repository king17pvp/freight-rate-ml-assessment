[project]
name = "freight-rate-prediction"
version = "0.1.0"
description = "Spotter ML Engineer assessment — Freight rate prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "xgboost>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src-layout: any package directory under src/ is importable by its bare name,
# e.g. src/eval/ -> `from eval import ...`
[tool.setuptools.packages.find]
where = ["src"]

# Default resolvable Python version (system has 3.12; falls back otherwise)
[tool.uv]
python-preference = "system"
